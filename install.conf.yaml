---
- defaults:
    link:
      relink: true
      force: true
      create: true

- link:
    ~/.aliases: shell/aliases
    ~/.zshrc: shell/zshrc
    ~/.fzf.zsh: shell/fzf.zsh
    ~/.oh-my-zsh: shell/ohmyzsh/
    ~/.gitconfig: gitconfig
    ~/.config/nvim:
      path: vim/astronvim
      create: true
    ~/.config/kitty/dracula.conf:
      path: shell/dracula-kitty/dracula.conf
      create: true
    ~/.zsh/functions/ff: shell/ff
    ~/.zsh/functions/wt: shell/wt
    ~/.zsh/functions/goto_sparse_dir: shell/goto_sparse_dir
    ~/.zsh/functions/core: shell/core
    ~/.zsh/functions/sfr: shell/sfr
    ~/.zsh/functions/admin: shell/admin
    ~/.zsh/functions/osw: shell/osw
    ~/.zsh/functions/shell: shell/shell
    ~/.zsh/functions/identity: shell/identity
    ~/.config/zellij/config.kdl:
      path: shell/zellij-config.kdl
      create: true
    ~/.config/ghostty/config:
      path: shell/ghostty-config
      create: true
    ~/.config/herdr/config.toml:
      path: shell/herdr-config.toml
      create: true

# Force this to happen after the initial symlink is setup
- link:
    ~/.oh-my-zsh/custom/themes/dracula: shell/dracula-zsh/
    ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting: shell/zsh-syntax-highlighting
