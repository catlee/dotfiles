---
- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/hypr: linux/omarchy/hypr
    ~/.local/bin/omarchy-adjust-window: linux/omarchy/adjust-window.sh
    ~/.local/bin/omarchy-agent: linux/omarchy/agent.sh
    ~/.local/bin/omarchy-agent-herdr: linux/omarchy/agent-herdr.sh
    ~/.gitconfig.local: gitconfig-personal


- shell:
  - sudo pacman --noconfirm -S zsh jq npm git-delta
  - mkdir -p "$HOME/.config/omarchy/plugins/chris.agents" && cp -a linux/omarchy/agents-plugin/. "$HOME/.config/omarchy/plugins/chris.agents/"
