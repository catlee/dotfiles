onboarding = false
# Mirrors the former tmux workflow: session -> workspace, window -> tab, pane -> pane.

[theme]
# Use the terminal's own palette.
name = "terminal"

[theme.custom]
# Active-tab text is drawn on the accent background.
panel_bg = "black"

[terminal]
# Start splits, tabs, and workspaces in the active pane's directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+minus", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = ["prefix+h", "ctrl+alt+left", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+down", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+up", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+right", "ctrl+alt+l"]

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+shift+x"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# type = "pane" always opens zoomed (no placement option in 0.9.0). The
# pi-pane plugin (herdr/plugins/pi-pane, linked locally) declares a split pane
# entrypoint that runs pi directly — no shell wrapper.
[[keys.command]]
key = "prefix+a"
type = "shell"
command = "herdr plugin pane open --plugin pi-pane --entrypoint pi --direction right --focus --cwd \"$PWD\""
description = "new split pane running pi"

# Seamless Vim/Neovim split and Herdr pane navigation.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

# Cycle tab panes through preset layouts (tmux prefix+space style).
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-layout-cycle.cycle-layout"
description = "cycle layout"

[[keys.command]]
key = "prefix+shift+space"
type = "plugin_action"
command = "herdr-layout-cycle.cycle-layout-back"
description = "cycle layout (back)"

[ui]
accent = "blue"
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
confirm_close = false
prompt_new_tab_name = false
mouse_capture = true
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]
window_title = "{hostname}: {workspace}"
